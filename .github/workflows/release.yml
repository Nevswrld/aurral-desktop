name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: AurralDesktop-Setup-${{ github.event.inputs.tag || github.ref_name }}-windows-x64.exe
          - os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: AurralDesktop-${{ github.event.inputs.tag || github.ref_name }}-linux-x64.tar.gz
          - os: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: AurralDesktop-${{ github.event.inputs.tag || github.ref_name }}-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Users\runneradmin\AppData\Local\Programs\Inno Setup 6\ISCC.exe" }
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aurral-desktop.exe" "target/release/aurral-desktop.exe" -Force
          $iss = Get-Content installer/aurral-desktop.iss -Raw
          $iss = $iss.Replace('#define MyAppVersion "0.1.0"', "#define MyAppVersion `"$version`"")
          $iss = $iss.Replace('OutputBaseFilename=AurralDesktop-Setup-{#MyAppVersion}', "OutputBaseFilename=AurralDesktop-Setup-$tag-windows-x64")
          Set-Content installer/aurral-desktop.ci.iss $iss -Encoding utf8
          & $iscc "installer/aurral-desktop.ci.iss"
          $out = Get-ChildItem dist\AurralDesktop-Setup-$tag-windows-x64.exe | Select-Object -First 1
          if (-not $out) { throw "Installer not found" }

      - name: Package Linux tarball
        if: matrix.os == 'linux'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          OUT="AurralDesktop-${TAG}-linux-x64"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/aurral-desktop" "$OUT/"
          cp README.md "$OUT/"
          chmod +x "$OUT/aurral-desktop"
          tar -czf "${OUT}.tar.gz" "$OUT"

      - name: Package macOS app
        if: matrix.os == 'macos'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APP="Aurral Desktop.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/aurral-desktop" "$APP/Contents/MacOS/aurral-desktop"
          chmod +x "$APP/Contents/MacOS/aurral-desktop"
          # Create icns
          mkdir -p icon.iconset
          sips -z 16 16 assets/aurral-icon-512.png --out icon.iconset/icon_16x16.png
          sips -z 32 32 assets/aurral-icon-512.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/aurral-icon-512.png --out icon.iconset/icon_32x32.png
          sips -z 64 64 assets/aurral-icon-512.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/aurral-icon-512.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 assets/aurral-icon-512.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/aurral-icon-512.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 assets/aurral-icon-512.png --out icon.iconset/icon_256x256@2x.png
          cp assets/aurral-icon-512.png icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/aurral.icns"
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Aurral Desktop</string>
            <key>CFBundleDisplayName</key><string>Aurral Desktop</string>
            <key>CFBundleIdentifier</key><string>org.aurral.desktop</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>aurral-desktop</string>
            <key>CFBundleIconFile</key><string>aurral.icns</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${TAG#v}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${TAG#v}" "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "AurralDesktop-${TAG}-macos-arm64.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/AurralDesktop-Setup-${{ github.event.inputs.tag || github.ref_name }}-windows-x64.exe
            AurralDesktop-${{ github.event.inputs.tag || github.ref_name }}-linux-x64.tar.gz
            AurralDesktop-${{ github.event.inputs.tag || github.ref_name }}-macos-arm64.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
