app-id: org.aurral.Desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: aurral-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: aurral-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 aurral-desktop /app/bin/aurral-desktop
      - install -Dm644 org.aurral.Desktop.desktop /app/share/applications/org.aurral.Desktop.desktop
      - install -Dm644 aurral-icon-512.png /app/share/icons/hicolor/512x512/apps/org.aurral.Desktop.png
    sources:
      - type: file
        path: aurral-desktop
      - type: file
        path: org.aurral.Desktop.desktop
      - type: file
        path: aurral-icon-512.png
